<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tarjeta-style.css">
    <title>Tarjeta de Presentación</title>
</head>
<body>
    <div class="card">
        <div class="card-left">
            <img class="foto-perfil" src="img/Otros/Victor Herrera.jpeg" alt="goku">
            <h2><span class="color-nombre">Victor</span> Herrera</h2>
            <h3>Programador Fronted</h3>
            <div class="qr-div"><img class="qr" src="img/Otros/Qr Whatsapp Victor.jpg" alt=""></div>
        </div>
        <div class="card-right">
            
            <div class="datos-div">
                <img class="img-black" src="img/Logos/WhatsApp negro 2.png" alt="">
                <span class="text-black">930653224</span>
            </div>
            <div class="datos-div">
                <img class="img-black" src="img/Logos/Email Negro 2.png" alt="Email">
                <span class="text-black">herrera.victor@outlook.com</span>
            </div>
            <div class="datos-div">
                <img class="img-black" src="img/Logos/GitHub Logo2.png" alt="GitHub">
                <span class="text-black">vienheno</span>
            </div>
            <div class="description-div">
                <p class="description-p">Programador Junior con formación en Nomada BootCamp. <br>Capacidad demostrada para desarrollar aplicaciones web funcionales y colaborar en entornos ágiles.
                </p>
                <button class="button">Más info</button>
            </div>
            <div class="tech">
                <img class="tech-img" src="img/Logos/C++ logo2.png" alt="">
                <img class="tech-img" src="img/Logos/Logo JS.png" alt="">
                <img class="tech-img" src="img/Logos/Git logo.png" alt="">
                <img class="tech-img" src="img/Logos/Logo HTML.png" alt="">
                <img class="tech-img" src="img/Logos/Logo CSS.png" alt="">
            </div>
        </div>
    </div>
    
</body>
</html>
